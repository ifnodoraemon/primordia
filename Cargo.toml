[package]
name = "primordia"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity"]
description = "A pure LLM-driven autonomous meta-world foundation in Rust"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
